---
services:
  seerr:
    image: ${image}
    init: true
    container_name: ${container_name}
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ}
      - PORT=5055 #optional
    volumes:
      - /var/lib/docker/volumes/${container_name}/config:/app/config
    ports:
      - target: 5055
        published: 5055
        protocol: tcp
        mode: host        
    deploy:
      mode: replicated
      replicas: 1

      placement:
        constraints:
          - node.labels.deployment.target.seerr == true
      restart_policy:
        condition: any
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped